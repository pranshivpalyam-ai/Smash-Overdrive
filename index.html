<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Smash Overdrive</title>
  <link rel="stylesheet" href="style.css">
  <!-- The single external dependency. Pinned; everything else is generated in code. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- #app is letterboxed to 9:16 by scene.js; everything lives inside it. -->
  <div id="app">
    <canvas id="gl"></canvas>
    <div id="overlay">
      <!-- #ui is a fixed 480x854 design space, scaled to the stage by main.js -->
      <div id="ui">
        <div id="arrows"></div>
        <div id="screens" hidden></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
